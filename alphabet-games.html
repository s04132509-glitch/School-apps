<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アルファベット・ゲームセンター</title>
<style>
:root{
  --bg:#fffaf0; --panel:#ffffff; --ink:#2b2b3a; --sub:#6b6b80; --line:#e6dfcf;
  --pri:#ff7a45; --pri-ink:#fff; --ok:#2fb36b; --ng:#e5484d; --blue:#3a7bd5; --star:#ffc93c;
  --c1:#ff7a45; --c2:#3a7bd5; --c3:#2fb36b; --c4:#a35ee8; --c5:#e5a100;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:3px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:clamp(16px,2.6vw,24px);margin:0;flex:1 1 auto;white-space:nowrap}
.hbtn{min-height:48px;min-width:48px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700}
#teacherBtn{position:relative;overflow:hidden}
#teacherBtn .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffe2d3;z-index:-1}
#scores{display:flex;gap:6px;flex-wrap:wrap;width:100%}
#scores:empty{display:none}
.chip{padding:4px 12px;border-radius:999px;font-weight:700;border:3px solid transparent;background:#f3efe4;font-size:clamp(14px,2.2vw,18px)}
.chip.turn{border-color:var(--pri);background:#fff1e9}
main{padding:12px;max-width:1200px;margin:0 auto}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.gbtn{border:none;border-radius:22px;padding:18px;min-height:130px;text-align:left;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
.gbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.gbtn b{font-size:clamp(20px,3vw,28px)} .gbtn span{font-size:15px;opacity:.95}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar .grow{flex:1}
.big{min-height:60px;padding:8px 20px;border-radius:16px;border:none;background:var(--pri);color:var(--pri-ink);font-weight:800;font-size:clamp(17px,2.6vw,22px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big.blue{background:var(--blue)} .big.gray{background:#8b8b9a} .big.green{background:var(--ok)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.seg button{min-height:52px;padding:6px 14px;border:none;background:#fff;font-weight:700}
.seg button.on{background:var(--pri);color:#fff}
.msg{font-size:clamp(18px,3vw,26px);font-weight:800;text-align:center;margin:6px 0}
.timer{height:12px;border-radius:6px;background:#eee;overflow:hidden;margin:4px 0 10px}
.timer i{display:block;height:100%;background:var(--blue);width:100%;transition:width .25s linear}
.cards{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,3),1fr)}
.card{aspect-ratio:1/1;border-radius:20px;border:4px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:min(14vw,90px);font-weight:700;padding:6px;position:relative}
.card:active{transform:scale(.97)}
.card.ok{border-color:var(--ok);background:#e8f8ef}
.card.ng{border-color:var(--ng);background:#fdecec;opacity:.55}
.card svg{width:100%;height:100%}
.ltr{font-family:"Andika","Century Gothic","Avenir Next","Segoe UI",Roboto,Arial,sans-serif}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.mem{perspective:600px}
.mem .card{transition:transform .3s;background:linear-gradient(135deg,#ffb38a,#ff7a45);border-color:#ffd5bf}
.mem .card .face{display:none;width:100%;height:100%}
.mem .card.open{background:#fff;border-color:var(--line)}
.mem .card.open .face{display:block}
.mem .card.done{background:#e8f8ef;border-color:var(--ok)}
.mem .card .q{font-size:min(10vw,56px);color:#fff}
.mem .card.open .q{display:none}
.scene{position:relative;width:fit-content;max-width:100%;margin:0 auto;border-radius:16px;overflow:hidden;border:3px solid var(--line);background:#fff}
.scene svg,.scene img{display:block;max-width:100%;width:auto;height:auto;max-height:calc(100dvh - 170px)}
.scene svg{width:1000px;aspect-ratio:1000/640;height:auto}
.scene .hot{cursor:pointer}
.ring{position:absolute;border:6px solid var(--star);border-radius:50%;pointer-events:none;animation:pulse 1s ease-in-out 3}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.4}}
.found{position:absolute;border:5px solid var(--ok);border-radius:50%;pointer-events:none;background:rgba(47,179,107,.2)}
.miss{position:absolute;border:5px solid var(--ng);border-radius:50%;pointer-events:none}
.scene .lt{cursor:pointer}
.trace-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (orientation:landscape) and (min-width:800px){.trace-wrap{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.pad{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:100/120;background:#fff;border-radius:18px;border:3px solid var(--line);touch-action:none}
.pad svg,.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.choices button{min-height:90px;border-radius:18px;border:3px solid var(--line);background:#fff;font-size:min(10vw,56px);font-weight:700}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.picker button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:700}
.picker button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dotwrap{width:min(100%, calc(100dvh - 190px));min-width:280px;margin:0 auto;aspect-ratio:1/1;background:#fff;border-radius:18px;border:3px solid var(--line);touch-action:none}
.dotwrap svg{width:100%;height:100%;display:block;touch-action:none}
#pts .dot{fill:#334155}
#pts text{font-size:4.6px;font-weight:700;fill:#334155;pointer-events:none}
#pts g.next .dot{fill:var(--pri);r:2.6px;animation:blink 1s infinite}
#pts g.next text{fill:var(--pri);font-size:6px}
#pts g.done .dot{fill:#1d4ed8} #pts g.done text{fill:#94a3b8}
#pts g.bad .dot{fill:var(--ng);r:2.6px} #pts g.bad text{fill:var(--ng)}
@keyframes blink{50%{opacity:.35}}
.result{text-align:center;padding:20px}
.timelist{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.timelist span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:18px}
.result .stars{font-size:min(16vw,80px);color:var(--star);letter-spacing:6px}
.fx{position:fixed;pointer-events:none;font-size:34px;color:var(--star);z-index:50;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(200deg);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
.sheet{background:#fff;border-radius:20px;padding:18px;max-width:900px;width:100%}
.sheet h2{margin:4px 0 12px;font-size:22px}
.sheet h3{margin:18px 0 8px;font-size:18px;border-left:6px solid var(--pri);padding-left:8px}
.sheet .note{color:var(--sub);font-size:14px;margin:4px 0}
.vrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.vrow div{display:flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:12px;padding:4px 6px}
.vrow b{width:28px;font-size:22px}
.vrow button{min-height:44px;min-width:44px;border-radius:10px;border:2px solid var(--line);background:#fff}
.vrow button.rec{background:var(--ng);color:#fff}
.vrow .has{color:var(--ok);font-weight:700}
.edit-photo{position:relative;max-width:700px}
.edit-photo img{width:100%;display:block;border-radius:12px}
.edit-photo .dot{position:absolute;transform:translate(-50%,-50%);border:4px solid var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:rgba(58,123,213,.55)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b3a;color:#fff;padding:10px 18px;border-radius:14px;z-index:60;font-weight:700}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="homeBtn" aria-label="ホーム">🏠 ホーム</button>
  <h1>アルファベット・ゲームセンター</h1>
  <button class="hbtn" id="teacherBtn" title="長押しで開きます"><span class="fill"></span>⚙ 先生用（長押し）</button>
  <div id="scores"></div>
</header>
<main id="app"></main>

<script>
"use strict";
/* ========== 基本データ ========== */
const UP = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const LO = UP.map(c => c.toLowerCase());
const SIMILAR = { b:"dpq", d:"bpq", p:"qbd", q:"pdb", m:"nw", n:"mhu", u:"nv", v:"uy", w:"mv",
  i:"jl", j:"ig", l:"it", h:"nk", a:"oe", e:"ca", c:"eo", o:"ca", g:"qy", y:"gv", f:"tl", t:"fl",
  B:"DPR", D:"BOP", P:"RBF", R:"PBK", M:"NW", N:"MH", W:"MV", V:"UY", U:"VO", O:"QCD", Q:"OG",
  C:"GO", G:"CQ", E:"FB", F:"EP", I:"LJT", L:"IJ", J:"IL", T:"IY", K:"XR", X:"KY", Y:"VX", Z:"SN", S:"ZC" };
const TEAM_COLORS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","#16a3b8","#d6336c","#5c7cfa"];

/* 手書き風の文字（書き順の目安つき）。座標は 100×120 の箱。上の線 y=20、真ん中 y=50、下の線 y=80、さがる線 y=105 */
const STROKES = {
A:["M50 20 L28 80","M50 20 L72 80","M37 60 L63 60"],
B:["M32 20 L32 80","M32 20 L52 20 Q66 20 66 35 Q66 50 52 50 L32 50 M32 50 L55 50 Q70 50 70 65 Q70 80 55 80 L32 80"],
C:["M68 32 C62 16 32 16 30 50 C30 84 62 84 68 68"],
D:["M32 20 L32 80","M32 20 L46 20 C74 20 74 80 46 80 L32 80"],
E:["M34 20 L34 80","M34 20 L66 20","M34 50 L62 50","M34 80 L66 80"],
F:["M34 20 L34 80","M34 20 L66 20","M34 50 L62 50"],
G:["M68 32 C62 16 32 16 30 50 C30 84 64 84 68 66 L68 54 L54 54"],
H:["M30 20 L30 80","M70 20 L70 80","M30 50 L70 50"],
I:["M50 20 L50 80"],
J:["M60 20 L60 64 Q60 80 46 80 Q34 80 32 68"],
K:["M32 20 L32 80","M68 20 L32 56","M45 45 L70 80"],
L:["M34 20 L34 80 L66 80"],
M:["M26 80 L26 20","M26 20 L50 66 L74 20","M74 20 L74 80"],
N:["M30 80 L30 20","M30 20 L70 80","M70 80 L70 20"],
O:["M50 20 C23 20 23 80 50 80 C77 80 77 20 50 20"],
P:["M32 20 L32 80","M32 20 L52 20 Q68 20 68 36 Q68 52 52 52 L32 52"],
Q:["M50 20 C23 20 23 80 50 80 C77 80 77 20 50 20","M56 64 L72 84"],
R:["M32 20 L32 80","M32 20 L52 20 Q68 20 68 36 Q68 52 52 52 L32 52","M50 52 L70 80"],
S:["M68 30 C62 14 30 16 32 34 C34 48 66 46 68 63 C70 84 36 86 30 70"],
T:["M26 20 L74 20","M50 20 L50 80"],
U:["M30 20 L30 62 Q30 80 50 80 Q70 80 70 62 L70 20"],
V:["M28 20 L50 80","M50 80 L72 20"],
W:["M22 20 L36 80","M36 80 L50 30","M50 30 L64 80","M64 80 L78 20"],
X:["M30 20 L70 80","M70 20 L30 80"],
Y:["M30 20 L50 50","M70 20 L50 50 L50 80"],
Z:["M30 20 L70 20 L30 80 L70 80"],
a:["M64 57 C58 46 36 46 36 65 C36 84 60 84 64 70","M64 50 L64 80"],
b:["M36 20 L36 80","M36 65 C36 46 66 46 66 65 C66 84 36 84 36 65"],
c:["M64 57 C58 46 36 46 36 65 C36 84 58 84 64 74"],
d:["M64 65 C64 46 34 46 34 65 C34 84 64 84 64 65","M64 20 L64 80"],
e:["M36 65 L64 65 C64 46 36 46 36 65 C36 84 58 84 64 76"],
f:["M62 25 Q56 18 50 20 Q44 22 44 32 L44 80","M34 50 L58 50"],
g:["M64 65 C64 46 34 46 34 65 C34 84 64 84 64 65","M64 50 L64 96 Q64 106 50 106 Q40 106 36 100"],
h:["M36 20 L36 80","M36 62 Q36 50 50 50 Q64 50 64 62 L64 80"],
i:["M50 50 L50 80","M50 36 L50 37"],
j:["M54 50 L54 98 Q54 106 44 106 Q38 106 35 101","M54 36 L54 37"],
k:["M38 20 L38 80","M62 50 L38 68","M46 62 L64 80"],
l:["M50 20 L50 80"],
m:["M28 50 L28 80","M28 61 Q28 50 38 50 Q48 50 48 61 L48 80","M48 61 Q48 50 58 50 Q68 50 68 61 L68 80"],
n:["M36 50 L36 80","M36 62 Q36 50 50 50 Q64 50 64 62 L64 80"],
o:["M50 50 C31 50 31 80 50 80 C69 80 69 50 50 50"],
p:["M36 50 L36 106","M36 65 C36 46 66 46 66 65 C66 84 36 84 36 65"],
q:["M64 65 C64 46 34 46 34 65 C34 84 64 84 64 65","M64 50 L64 106"],
r:["M40 50 L40 80","M40 62 Q42 50 60 52"],
s:["M62 55 C56 46 38 46 38 56 C38 64 62 62 62 72 C62 84 40 84 36 76"],
t:["M46 28 L46 73 Q46 80 54 80 Q60 80 62 76","M36 50 L60 50"],
u:["M36 50 L36 68 Q36 80 50 80 Q64 80 64 68","M64 50 L64 80"],
v:["M36 50 L50 80","M50 80 L64 50"],
w:["M28 50 L38 80","M38 80 L50 56","M50 56 L62 80","M62 80 L72 50"],
x:["M36 50 L64 80","M64 50 L36 80"],
y:["M36 50 L50 80","M64 50 L44 106"],
z:["M36 50 L64 50 L36 80 L64 80"]
};
const GUIDE = '<g stroke="#9ec3f0" stroke-width="0.8"><line x1="0" y1="20" x2="100" y2="20"/><line x1="0" y1="80" x2="100" y2="80"/><line x1="0" y1="105" x2="100" y2="105"/></g><line x1="0" y1="50" x2="100" y2="50" stroke="#f0a3a3" stroke-width="0.8" stroke-dasharray="3 2"/>';
function glyph(ch, color, lines){
  const d = (STROKES[ch]||[]).map(s=>`<path d="${s}"/>`).join("");
  return `<svg viewBox="0 0 100 120" aria-label="${ch}">${lines?GUIDE:""}<g fill="none" stroke="${color||"#2b2b3a"}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">${d}</g></svg>`;
}

/* ========== 保存（設定・得点） ========== */
const DEF = { kase:"upper", letters:UP.join(""), time:0, teams:0, rate:0.8, font:"hand", usePhoto:false };
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? Object.assign({}, d, JSON.parse(v)) : Object.assign({}, d); }catch(e){ return Object.assign({}, d); } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let S = load("abc-settings", DEF);
let SC = load("abc-scores", { pts:[0,0,0,0,0,0,0,0], solo:0, turn:0 });

/* IndexedDB（録音した声・写真） */
let dbP = null;
function db(){
  if(!dbP) dbP = new Promise((res,rej)=>{ try{ const r = indexedDB.open("alphabet-games",1);
    r.onupgradeneeded = ()=>r.result.createObjectStore("kv"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);}catch(e){rej(e)} });
  return dbP;
}
async function kvGet(k){ try{ const d = await db(); return await new Promise(r=>{ const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(undefined); }); }catch(e){ return undefined; } }
async function kvSet(k,v){ try{ const d = await db(); await new Promise(r=>{ const t = d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=r; t.onerror=r; }); }catch(e){} }
async function kvDel(k){ try{ const d = await db(); await new Promise(r=>{ const t = d.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=r; t.onerror=r; }); }catch(e){} }
const VOICE = {};   // A..Z → objectURL
let PHOTO = null;   // {url, spots:[{ch,x,y,r}]}
async function loadStored(){
  for(const c of UP){ const b = await kvGet("voice:"+c); if(b) VOICE[c] = URL.createObjectURL(b); }
  const p = await kvGet("photo"); if(p && p.blob) PHOTO = { url: URL.createObjectURL(p.blob), blob:p.blob, spots: p.spots||[] };
}

/* ========== 音 ========== */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function tone(f, t0, dur, type, vol){ const a = ac(); if(!a) return; const o = a.createOscillator(), g = a.createGain();
  o.type = type||"sine"; o.frequency.value = f; g.gain.setValueAtTime(vol||.25, a.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001, a.currentTime+t0+dur);
  o.connect(g).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+dur+.05); }
const sfx = {
  ok(){ tone(784,0,.18); tone(1047,.12,.3); },
  ng(){ tone(180,0,.25,"square",.12); },
  flip(){ tone(520,0,.06,"triangle",.15); },
  clap(){ const a = ac(); if(!a) return; const len = a.sampleRate*1.3, buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
    for(let n=0;n<14;n++){ const st = Math.floor((n*0.085+Math.random()*.04)*a.sampleRate); for(let i=0;i<2200&&st+i<len;i++) d[st+i] += (Math.random()*2-1)*Math.exp(-i/350)*.6; }
    const s = a.createBufferSource(); s.buffer = buf; const f = a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1500; s.connect(f).connect(a.destination); s.start(); },
  fan(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3)); }
};
let enVoice = null;
function pickVoice(){ try{ const vs = speechSynthesis.getVoices(); enVoice = vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(ch){
  const k = String(ch).toUpperCase();
  if(VOICE[k]){ const au = new Audio(VOICE[k]); au.play().catch(()=>tts(k)); return; }
  tts(k);
}
function tts(text){
  if(!("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; if(enVoice) u.voice = enVoice; u.rate = S.rate; speechSynthesis.speak(u); }catch(e){}
}

/* ========== 共通の道具 ========== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const app = $("#app");
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let cleanup = [], GEN = 0;
function later(fn, ms){ const g = GEN; setTimeout(()=>{ if(g===GEN) fn(); }, ms); }
function onLeave(fn){ cleanup.push(fn); }
function leave(){ GEN++; cleanup.forEach(f=>{ try{f()}catch(e){} }); cleanup = []; try{ speechSynthesis.cancel(); }catch(e){} }
function toast(t){ const d = document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function starsAt(el){ const r = el.getBoundingClientRect(); const x = r.left+r.width/2, y = r.top+r.height/2;
  for(let i=0;i<10;i++){ const s = document.createElement("span"); s.className="fx"; s.textContent="★"; s.style.left=(x-17)+"px"; s.style.top=(y-17)+"px";
    const ang = Math.random()*Math.PI*2, dist = 80+Math.random()*90; s.style.setProperty("--dx",Math.cos(ang)*dist+"px"); s.style.setProperty("--dy",Math.sin(ang)*dist+"px");
    document.body.appendChild(s); setTimeout(()=>s.remove(),1050); } }
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function letterHTML(ch, color){ return S.font==="hand" && STROKES[ch] ? glyph(ch,color) : `<span class="ltr">${ch}</span>`; }
/* 出題する文字（先生の設定から） */
function pool(kase){
  const L = (S.letters||UP.join("")).split("").filter(c=>UP.includes(c));
  const base = L.length ? L : UP.slice();
  const k = kase || S.kase;
  if(k==="upper") return base.slice();
  if(k==="lower") return base.map(c=>c.toLowerCase());
  return base.concat(base.map(c=>c.toLowerCase()));
}
function distractors(target, all, n){
  const sim = (SIMILAR[target]||"").split("").filter(c=>all.includes(c) && c!==target);
  const rest = shuffle(all.filter(c=>c!==target && !sim.includes(c)));
  return shuffle(sim).concat(rest).slice(0,n);
}

/* 得点（班・個人） */
function teamsOn(){ return S.teams>0; }
function renderScores(){
  const box = $("#scores");
  if(!teamsOn()){ box.innerHTML = ""; return; }
  box.innerHTML = Array.from({length:S.teams},(_,i)=>`<span class="chip ${SC.turn===i?"turn":""}" style="color:${TEAM_COLORS[i]}">${i+1}班 ${SC.pts[i]}点</span>`).join("");
}
function addPoint(n){ if(teamsOn()) SC.pts[SC.turn] += (n||1); else SC.solo += (n||1); save("abc-scores",SC); renderScores(); }
function nextTurn(){ if(teamsOn()){ SC.turn = (SC.turn+1)%S.teams; save("abc-scores",SC); renderScores(); } }
function turnLabel(){ return teamsOn() ? `<span style="color:${TEAM_COLORS[SC.turn]}">${SC.turn+1}班の番</span>` : ""; }

/* 制限時間 */
function startTimer(sec, barEl, onEnd){
  if(!sec){ if(barEl) barEl.style.display="none"; return ()=>{}; }
  const t0 = Date.now(); let stop = false;
  const id = setInterval(()=>{ if(stop) return; const left = sec - (Date.now()-t0)/1000;
    if(barEl) barEl.firstElementChild.style.width = Math.max(0,left/sec*100)+"%";
    if(left<=0){ stop = true; clearInterval(id); onEnd(); } }, 250);
  const off = ()=>{ stop = true; clearInterval(id); };
  onLeave(off); return off;
}
function result(title, score, max, again){
  const ratio = max ? score/max : 1, n = ratio>=.9?3:ratio>=.6?2:1;

  $("#again").onclick = again; $("#toHome").onclick = home;
}

/* ========== ① カルタ ========== */
function karutaMenu(){
  menuScreen("① アルファベット・カルタ", [
    { key:"n", label:"むずかしさ", opts:[["やさしい（6まい）",6],["ふつう（9まい）",9],["むずかしい（12まい）",12]] },
    { key:"kase", label:"文字", def:["upper","lower","both"].indexOf(S.kase), opts:[["大文字","upper"],["小文字","lower"],["まぜる","both"]] }
  ], o=>karuta(o));
}
function karuta(o){
  leave();
  const all = pool(o.kase), N = Math.min(o.n, all.length), Q = 10;
  let q = 0, score = 0, target, tries;
  app.innerHTML = `<div class="bar"><span class="msg grow" id="info"></span><button class="big blue" id="again">🔊 もう一度</button></div>
    <div class="timer" id="tm"><i></i></div><div class="cards" id="cards" style="--cols:${N<=6?3:N<=9?3:4}"></div>`;
  const cards = $("#cards");
  function landscape(){ const land = innerWidth>innerHeight; cards.style.setProperty("--cols", land ? (N===9?5:6) : (N===12?4:3)); }
  landscape(); addEventListener("resize",landscape); onLeave(()=>removeEventListener("resize",landscape));
  function next(){
    if(q>=Q){ return result("カルタ おしまい！", score, Q, ()=>karuta(o)); }
    q++; tries = 0; target = all[rnd(all.length)];
    const set = shuffle([target].concat(distractors(target, all, N-1)));
    $("#info").innerHTML = `${q} / ${Q}問　${turnLabel()}`;
    cards.innerHTML = set.map(c=>`<button class="card" data-c="${c}">${letterHTML(c)}</button>`).join("");
    later(()=>say(target), 300);
  }
  cards.onclick = e=>{
    const b = e.target.closest(".card"); if(!b || b.classList.contains("ng") || b.classList.contains("ok")) return;
    if(b.dataset.c===target){
      b.classList.add("ok"); sfx.ok(); sfx.clap(); starsAt(b); say(target);
      if(tries===0){ score++; addPoint(); }
      $$(".card",cards).forEach(x=>x.disabled = true);
      later(()=>{ nextTurn(); next(); }, 1300);
    }else{ tries++; b.classList.add("ng"); shake(b); sfx.ng(); later(()=>say(target),500); }
  };
  $("#again").onclick = ()=>say(target);
  startTimer(S.time, $("#tm"), ()=>result("時間です！", score, q, ()=>karuta(o)));
  next();
}

function memoryMenu(){
  menuScreen("② 大文字・小文字 神経衰弱", [
    { key:"n", label:"ペアの数", opts:[["4ペア",4],["6ペア",6],["8ペア",8],["10ペア",10]] }
  ], o=>memory(o));
}
function memory(o){
  leave();
  const letters = shuffle(pool("upper")).slice(0,o.n);
  const deck = shuffle(letters.flatMap(c=>[{c, k:c},{c:c.toLowerCase(), k:c}]));
  let open = [], lock = false, pairs = 0, moves = 0;
  const cols = ()=> innerWidth>innerHeight ? Math.ceil(deck.length/ (deck.length>12?3:2)) : (deck.length>12?4:4);
  app.innerHTML = `<div class="bar"><span class="msg grow" id="info"></span></div><div class="timer" id="tm"><i></i></div>
    <div class="cards mem" id="cards"></div>`;
  const cards = $("#cards");
  const setCols = ()=>cards.style.setProperty("--cols", Math.min(cols(), 8)); setCols();
  addEventListener("resize",setCols); onLeave(()=>removeEventListener("resize",setCols));
  cards.innerHTML = deck.map((d,i)=>`<button class="card" data-i="${i}"><span class="q">?</span><span class="face">${S.font==="hand"?glyph(d.c, d.c===d.k?"#c2410c":"#1d4ed8"):`<span class="ltr" style="color:${d.c===d.k?"#c2410c":"#1d4ed8"}">${d.c}</span>`}</span></button>`).join("");
  const info = ()=> $("#info").innerHTML = `見つけたペア ${pairs} / ${o.n}　${turnLabel()}`;
  info();
  cards.onclick = e=>{
    const b = e.target.closest(".card"); if(!b || lock || b.classList.contains("open")) return;
    const d = deck[b.dataset.i]; b.classList.add("open"); sfx.flip(); say(d.c); open.push(b);
    if(open.length<2) return;
    moves++; lock = true;
    const [x,y] = open.map(el=>deck[el.dataset.i]);
    if(x.k===y.k){
      later(()=>{ open.forEach(el=>el.classList.add("done")); sfx.ok(); sfx.clap(); starsAt(open[1]); pairs++; addPoint(); open = []; lock = false; info();
        if(pairs===o.n) later(()=>result(`ぜんぶ見つけた！（${moves}回めくった）`, o.n, o.n, ()=>memory(o)), 900); }, 500);
    }else{
      later(()=>{ open.forEach(el=>el.classList.remove("open")); open = []; lock = false; nextTurn(); info(); }, 1300);
    }
  };
  startTimer(S.time, $("#tm"), ()=>result("時間です！", pairs, o.n, ()=>memory(o)));
}

function hiddenGame(){
  leave();
  const usePhoto = !!(S.usePhoto && PHOTO && PHOTO.spots.length);
  const Q = 10; let q = 0, score = 0, target = null, need = [], hinted = false, busy = false;
  const times = []; let qStart = 0;   // 1問ごとにかかった時間（ミリ秒）
  app.innerHTML = `<div class="bar"><span class="msg grow" id="info"></span><span class="msg" id="qclock"></span><button class="big blue" id="again">🔊 もう一度</button><button class="big gray" id="hint">💡 ヒント</button></div>
    <div class="timer" id="tm"><i></i></div>
    <div class="scene" id="scene">${usePhoto ? `<img src="${PHOTO.url}" alt="先生の写真">` : sceneSVG()}</div>`;
  const scene = $("#scene"), media = scene.firstElementChild;
  const NS = "http://www.w3.org/2000/svg";
  /* 文字の一覧。SP = [{ch, found, ...}] */
  let SP = [];
  if(!usePhoto){
    // 看板の単語を1文字ずつに分け、文字ごとにタッチできる部品にする
    $$(".sign", scene).forEach(g=>{
      const t = $("text",g), rc = $("rect",g), bb = t.getBBox(), pad = bb.height*0.3, w = t.textContent;
      rc.setAttribute("x", bb.x-pad); rc.setAttribute("width", bb.width+pad*2);
      const y = t.getAttribute("y"), attrs = ["font-size","font-weight","font-family","fill"].map(a=>`${a}="${t.getAttribute(a)}"`).join(" ");
      const boxes = [];
      for(let i=0;i<w.length;i++){ if(w[i]===" ") continue; const e = t.getExtentOfChar(i); boxes.push({ i, ch:w[i], x:e.x, y:e.y, w:e.width, h:e.height }); }
      t.remove();
      for(const b of boxes){
        const lt = document.createElementNS(NS,"g"); lt.setAttribute("class","lt");
        lt.innerHTML = `<rect class="hl" x="${b.x-1}" y="${b.y+b.h*0.08}" width="${b.w+2}" height="${b.h*0.84}" rx="4" fill="transparent"/><text x="${b.x}" y="${y}" ${attrs}>${b.ch}</text>`;
        g.appendChild(lt);
        SP.push({ ch:b.ch, el:lt, box:b, cx:b.x+b.w/2, cy:b.y+b.h/2, found:false });
      }
    });
  }else{
    SP = PHOTO.spots.map(s=>({ ch:s.ch, x:s.x, y:s.y, r:s.r, found:false }));
  }
  /* 出題する文字：町（写真）の中にある文字すべて。大文字・小文字をまぜてランダムに出す（先生の設定の文字の範囲から） */
  const inScene = [...new Set(SP.map(s=>s.ch))];
  const allowed = pool("both");
  let cand = inScene.filter(c=>allowed.includes(c));
  if(!cand.length) cand = inScene;
  let deck = [];
  const drawTarget = ()=>{ if(!deck.length) deck = shuffle(cand.filter(c=>c!==target).length ? cand.filter(c=>c!==target) : cand); return deck.pop(); };

  /* 画面の座標 → 絵の座標 */
  function svgPoint(e){ const m = media.getScreenCTM().inverse(); const p = media.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(m); }
  function hitSVG(e){
    // 文字の上（文字の四角の中）をタッチしたときだけ、その文字と判定する
    const p = svgPoint(e); let inside = null, inD = 1e9;
    for(const s of SP){ const b = s.box;
      if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){ const dc = Math.hypot(p.x-s.cx, p.y-s.cy); if(dc < inD){ inD = dc; inside = s; } } }
    return inside;
  }
  function hitPhoto(e){
    const r = media.getBoundingClientRect(); const px = (e.clientX-r.left)/r.width, py = (e.clientY-r.top)/r.height;
    let best = null, bd = 1e9;
    for(const s of SP){ const d = Math.hypot(px-s.x, (py-s.y)*r.height/r.width); if(d < s.r*1.15 && d < bd){ bd = d; best = s; } }
    return best;
  }
  /* 写真のときの丸じるし */
  function mark(cls, s, scale){ const d = document.createElement("div"); d.className = cls; const m = media.getBoundingClientRect(), sr = scene.getBoundingClientRect();
    let cx, cy, rp;
    if(usePhoto){ cx = s.x*m.width; cy = s.y*m.height; rp = s.r*m.width; }
    else { const k = m.width/1000; cx = s.cx*k; cy = s.cy*k; rp = Math.max(s.box.w, s.box.h)*0.6*k; }
    rp *= (scale||1);
    d.style.width = d.style.height = rp*2+"px"; d.style.left = (m.left-sr.left-scene.clientLeft + cx - rp)+"px"; d.style.top = (m.top-sr.top-scene.clientTop + cy - rp)+"px";
    scene.appendChild(d); return d; }
  function setLook(s, state){ // state: "found" | "wrong" | ""
    if(usePhoto){ if(state==="found") s.mk = mark("found", s); else if(state==="wrong"){ const m = mark("miss", s); later(()=>m.remove(),600); } return; }
    const hl = $(".hl", s.el);
    if(state==="found"){ hl.setAttribute("fill","rgba(47,179,107,.45)"); hl.setAttribute("stroke","#2fb36b"); hl.setAttribute("stroke-width","2"); }
    else if(state==="wrong"){ hl.setAttribute("fill","rgba(229,72,77,.45)"); later(()=>{ if(!s.found) hl.setAttribute("fill","transparent"); }, 600); }
    else { hl.setAttribute("fill","transparent"); hl.removeAttribute("stroke"); }
  }
  const isUp = c => c===c.toUpperCase();
  const caseName = c => isUp(c) ? "大文字" : "小文字";
  // 読み上げ：録音があれば録音、なければ「capital A」「small a」と大文字・小文字も伝える
  const sayTarget = ()=>{ if(VOICE[target.toUpperCase()]) say(target); else tts((isUp(target) ? "capital " : "small ") + target.toUpperCase()); };
  const fmt = ms => { const t = ms/1000; return t < 60 ? t.toFixed(1)+"秒" : Math.floor(t/60)+"分"+(t%60).toFixed(1)+"秒"; };
  const total = ()=> times.reduce((a,b)=>a+b,0);
  const tick = setInterval(()=>{ const c = $("#qclock"); if(c && target && !busy) c.textContent = "⏱ "+fmt(Date.now()-qStart); }, 200);
  onLeave(()=>clearInterval(tick));
  function info(){
    const left = need.filter(s=>!s.found).length;
    $("#info").innerHTML = `${q} / ${Q}　${caseName(target)}の「<span class="ltr" style="font-size:1.3em">${target}</span>」をぜんぶ見つけよう！ <span style="color:var(--blue)">あと ${left}こ</span>（ぜんぶで ${need.length}こ） ${turnLabel()}`;
  }
  function next(){
    $$(".found,.ring,.miss",scene).forEach(x=>x.remove());
    SP.forEach(s=>{ s.found = false; setLook(s,""); });
    if(q>=Q || !cand.length) return finish("ミッション クリア！");
    q++; hinted = false; busy = false; target = drawTarget();
    need = SP.filter(s=>s.ch===target);
    info(); later(()=>sayTarget(), 300);
    qStart = Date.now();
  }
  scene.onclick = e=>{
    if(busy || !target) return;
    const s = usePhoto ? hitPhoto(e) : hitSVG(e);
    if(!s) return;                 // 文字以外の所は何もしない
    if(s.found) return;            // 見つけた文字をもう一度タッチしても何もしない
    if(s.ch===target){
      s.found = true; setLook(s,"found"); sfx.ok(); say(target);
      starsAt(usePhoto ? s.mk : s.el);
      info();
      if(need.every(x=>x.found)){
        busy = true; sfx.clap();
        const t = Date.now()-qStart; times.push(t);
        if(!hinted){ score++; addPoint(); }
        $("#info").innerHTML = `⭐ ${caseName(target)}の「<span class="ltr">${target}</span>」を ${need.length}こ ぜんぶ見つけた！ <b>${fmt(t)}</b>`;
        $("#qclock").textContent = `合計 ${fmt(total())}`;
        later(()=>{ nextTurn(); next(); }, 1800);
      }
    }else{ sfx.ng(); setLook(s,"wrong"); }
  };
  $("#again").onclick = ()=>sayTarget();
  $("#hint").onclick = ()=>{ hinted = true; const c = need.filter(s=>!s.found); if(c.length){ const m = mark("ring", c[rnd(c.length)], 2.5); later(()=>m.remove(),3200); } sayTarget(); };
  /* おしまいの画面：1問ごとのタイムと、10問の合計タイム */
  function finish(title){
    leave(); sfx.fan(); sfx.clap();
    const n = times.length, ratio = Q ? score/Q : 1, st = ratio>=.9?3:ratio>=.6?2:1;
    app.innerHTML = `<div class="result"><div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div>
      <div class="msg">${title}　見つけた問題 ${n} / ${Q}</div>
      <div class="msg">${Q}問の合計タイム：<span style="color:var(--blue)">${fmt(total())}</span>　1問の平均：${n ? fmt(total()/n) : "－"}</div>
      <div class="timelist">${times.map((t,i)=>`<span>${i+1}問目　${fmt(t)}</span>`).join("")}</div>
      <div class="bar" style="justify-content:center;margin-top:20px"><button class="big" id="again2">もう一度</button><button class="big gray" id="toHome3">ホームへ</button></div></div>`;
    $("#again2").onclick = hiddenGame; $("#toHome3").onclick = home;
  }
  startTimer(S.time, $("#tm"), ()=>finish("時間です！"));
  next();
}

function traceMenu(){

    { key:"mode", label:"あそびかた", opts:[["なぞる","trace"],["なんの文字？","guess"],["ペアで出し合う","pair"]] },
    { key:"kase", label:"文字", def:["upper","lower","both"].indexOf(S.kase), opts:[["大文字","upper"],["小文字","lower"],["まぜる","both"]] }
  ], o=> o.mode==="trace" ? traceGame(o) : o.mode==="guess" ? guessGame(o) : pairGame(o));

function padHTML(ch, showGuide){

  return `<div class="pad" id="pad"><svg viewBox="0 0 100 120">${GUIDE}

/* 書き順の目安アニメーション */
async function animate(ch, color, perStroke, token){
  const g = $("#anim"); if(!g) return; g.innerHTML = ""; g.setAttribute("stroke", color||"#ff7a45");
  const used = [];
  for(const [i,dd] of (STROKES[ch]||[]).entries()){
    if(token && token.stop) return;
    const p = document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",dd); g.appendChild(p);
    const L = p.getTotalLength() || 1; p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    const num = document.createElementNS("http://www.w3.org/2000/svg","text"); const pt = p.getPointAtLength(0);
    let lx = pt.x+4; while(used.some(u=>Math.abs(u.x-lx)<6 && Math.abs(u.y-pt.y)<8)) lx += 7; used.push({x:lx,y:pt.y});
    num.setAttribute("x",lx); num.setAttribute("y",pt.y-3); num.setAttribute("font-size","9"); num.setAttribute("fill","#1d4ed8"); num.setAttribute("stroke","none"); num.textContent = i+1; g.appendChild(num);
    const t0 = performance.now();
    await new Promise(res=>{ const step = t=>{ if(token && token.stop) return res(); const k = Math.min(1,(t-t0)/perStroke); p.style.strokeDashoffset = L*(1-k); k<1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
    await sleep(150);
  }
}
/* 指で書く */
function drawPad(){
  const pad = $("#pad"), cv = $("#cv"), ctx = cv.getContext("2d"); let pts = [], cur = null;
  function size(){ const r = pad.getBoundingClientRect(); const dpr = devicePixelRatio||1; cv.width = r.width*dpr; cv.height = r.height*dpr; redraw(); }
  function toV(e){ const r = pad.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*100, y:(e.clientY-r.top)/r.height*120 }; }
  function redraw(){ ctx.clearRect(0,0,cv.width,cv.height); const k = cv.width/100; ctx.lineWidth = 6*k; ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = "#1d4ed8";
    for(const s of pts){ ctx.beginPath(); s.forEach((p,i)=> i ? ctx.lineTo(p.x*k,p.y*k) : ctx.moveTo(p.x*k,p.y*k)); if(s.length===1) ctx.lineTo(s[0].x*k+.1,s[0].y*k); ctx.stroke(); } }
  pad.onpointerdown = e=>{ pad.setPointerCapture(e.pointerId); cur = [toV(e)]; pts.push(cur); redraw(); };
  pad.onpointermove = e=>{ if(!cur) return; cur.push(toV(e)); redraw(); };
  pad.onpointerup = pad.onpointercancel = ()=>{ cur = null; };
  size(); addEventListener("resize",size); onLeave(()=>removeEventListener("resize",size));
  return { clear(){ pts = []; redraw(); }, points(){ return pts.flat(); }, empty(){ return !pts.length; } };
}
function checkTrace(ch, drawn){
  if(drawn.length<5) return 0;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.style.position="absolute"; svg.style.visibility="hidden"; document.body.appendChild(svg);
  let tot = 0, hit = 0;
  for(const dd of STROKES[ch]||[]){ const p = document.createElementNS("http://www.w3.org/2000/svg","path"); p.setAttribute("d",dd); svg.appendChild(p);
    const L = p.getTotalLength(); for(let s=0;s<=L;s+=2){ const pt = p.getPointAtLength(s); tot++; if(drawn.some(q=>Math.hypot(q.x-pt.x,q.y-pt.y)<8)) hit++; } }
  svg.remove();
  return tot ? hit/tot : 0;
}
function traceGame(o){

function orderList(o){
  let L = o.range===0 ? UP.filter(c=>S.letters.includes(c)) : o.range>0 ? UP.slice(0,o.range) : UP.slice(13);
  if(L.length < 8) L = UP.slice();   // 点が少なすぎると絵にならないので A〜Z にする
  return o.kase==="lower" ? L.map(c=>c.toLowerCase()) : L;
}
function dotGame(o){
  leave();
  const NS = "http://www.w3.org/2000/svg";
  const seq = orderList(o), n = seq.length;
  const pic = PICTURES[rnd(PICTURES.length)], art = /^[aeiou]/.test(pic.name) ? "an" : "a";
  // 形をランダムに回す・大きさと位置を変える
  const ang = (Math.random()*30-15)*Math.PI/180, sc = 0.78+Math.random()*0.1;
  const ox = 50 + (Math.random()*8-4), oy = 50 + (Math.random()*8-4);
  const T = p => { const x = (p.x-50)*sc, y = (p.y-50)*sc; return { x: ox + x*Math.cos(ang) - y*Math.sin(ang), y: oy + x*Math.sin(ang) + y*Math.cos(ang) }; };
  const ref = document.createElementNS(NS,"path"); ref.setAttribute("d", pic.d);
  const tmp = document.createElementNS(NS,"svg"); tmp.style.cssText = "position:absolute;width:0;height:0"; tmp.appendChild(ref); document.body.appendChild(tmp);
  const L = ref.getTotalLength();
  const at = len => T(ref.getPointAtLength(((len % L) + L) % L));
  // 点の場所：形のまわりに等しい間かくで。始まりの場所と向きはランダム
  const start = Math.random()*L, dir = Math.random()<.5 ? 1 : -1, step = L/n;
  const dots = seq.map((ch,i)=>({ ch, len: start + dir*step*i, ...at(start + dir*step*i) }));
  const outline = []; for(let s=0; s<=L; s+=0.8) outline.push(at(s));
  tmp.remove();
  const piece = (a, b) => { const pts = []; for(let k=0;k<=1.0001;k+=0.04) pts.push(at(a + (b-a)*k)); return pts; };
  const poly = pts => pts.map((p,i)=>(i?"L":"M")+p.x.toFixed(2)+" "+p.y.toFixed(2)).join(" ");
  // 文字は、ほかの点・線・文字からいちばん離れた向きに置く（重ならないように）
  const labels = [], line = outline.filter((_,i)=>i%3===0);
  dots.forEach((d,i)=>{
    let best = null, bs = -1;
    for(let a=0;a<12;a++){ const ang2 = a*Math.PI/6 + Math.random()*0.2, c = { x: d.x + Math.cos(ang2)*5.4, y: d.y + Math.sin(ang2)*5.4 };
      let sc2 = 99;
      dots.forEach((o,j)=>{ if(j!==i) sc2 = Math.min(sc2, Math.hypot(o.x-c.x, o.y-c.y)); });
      line.forEach(o=>{ sc2 = Math.min(sc2, Math.hypot(o.x-c.x, o.y-c.y)*1.3); });
      labels.forEach(o=>{ sc2 = Math.min(sc2, Math.hypot(o.x-c.x, o.y-1.6-c.y)*0.9); });
      if(sc2 > bs){ bs = sc2; best = c; } }
    labels.push({ x: best.x, y: best.y + 1.6 });
  });

  app.innerHTML = `<div class="bar"><span class="msg grow" id="info"></span><span class="msg" id="clock">0秒</span><span id="after" style="display:none;gap:8px"><button class="big" id="againPic">つぎの絵</button><button class="big gray" id="toHome2">ホームへ</button></span></div>
    <div class="timer" id="tm"><i></i></div>
    <div class="dotwrap"><svg id="dots" viewBox="-6 -6 112 112">
      <path id="fill" d="${poly(outline)} Z" fill="${pic.color}" fill-opacity="0" stroke="none"/>
      <g id="lines" fill="none" stroke="#1d4ed8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></g>
      <line id="rubber" stroke="#93c5fd" stroke-width="0.8" stroke-dasharray="1.5 1.2" visibility="hidden"/>
      <g id="pts">${dots.map((d,i)=>`<g data-i="${i}"><circle class="dot" cx="${d.x.toFixed(2)}" cy="${d.y.toFixed(2)}" r="1.6"/><text x="${labels[i].x.toFixed(2)}" y="${labels[i].y.toFixed(2)}" text-anchor="middle" class="ltr">${d.ch}</text></g>`).join("")}</g>
      <g id="extra"></g>
    </svg></div>`;
  const svg = $("#dots"), lines = $("#lines"), rubber = $("#rubber");
  let k = 0, ended = false, drag = false; const t0 = Date.now();
  const cid = setInterval(()=>{ if(!ended){ const c = $("#clock"); if(c) c.textContent = Math.round((Date.now()-t0)/1000)+"秒"; } }, 500); onLeave(()=>clearInterval(cid));
  function info(){ $("#info").innerHTML = k===0 ? `「<span class="ltr">${seq[0]}</span>」の点からスタート！ 順番に点をつなごう ${turnLabel()}` : `つぎは「<span class="ltr">${seq[k]}</span>」　（${k} / ${n}） ${turnLabel()}`; }
  function mark(){ $$("#pts g").forEach((g,i)=>{ g.classList.toggle("done", i<k); g.classList.toggle("next", i===k); }); }
  function toV(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
  function hit(p){ let best = -1, bd = 4.2; dots.forEach((d,i)=>{ const dd = Math.hypot(d.x-p.x, d.y-p.y); if(dd < bd){ bd = dd; best = i; } }); return best; }
  function connect(){
    if(k>0){ const p = document.createElementNS(NS,"path"); p.setAttribute("d", poly(piece(dots[k-1].len, dots[k].len))); lines.appendChild(p); }
    say(seq[k]); sfx.flip(); k++; mark();
    if(k>=n){ finish(); } else info();
  }
  function finish(){
    ended = true; drag = false; rubber.setAttribute("visibility","hidden");
    const p = document.createElementNS(NS,"path"); p.setAttribute("d", poly(piece(dots[n-1].len, dots[n-1].len + dir*step))); lines.appendChild(p);
    const f = $("#fill"); f.style.transition = "fill-opacity 1s"; requestAnimationFrame(()=>f.setAttribute("fill-opacity",".85"));
    const ex = $("#extra"); const dotAt = q => T({x:q[0],y:q[1]});
    if(pic.eye) [pic.eye, pic.eye2].filter(Boolean).forEach(q=>{ const e = dotAt(q); ex.insertAdjacentHTML("beforeend", `<circle cx="${e.x}" cy="${e.y}" r="2.6" fill="#fff"/><circle cx="${e.x}" cy="${e.y}" r="1.3" fill="#111"/>`); });
    if(pic.stem){ const [p1,p2] = pic.stem.map(dotAt); ex.insertAdjacentHTML("beforeend", `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#78350f" stroke-width="2.4" stroke-linecap="round"/>`); }
    if(pic.wheels) pic.wheels.forEach(q=>{ const e = dotAt(q); ex.insertAdjacentHTML("beforeend", `<circle cx="${e.x}" cy="${e.y}" r="${8*sc}" fill="#111"/><circle cx="${e.x}" cy="${e.y}" r="${3.5*sc}" fill="#ddd"/>`); });
    const sec = Math.round((Date.now()-t0)/1000);
    $("#info").innerHTML = `⭐ かんせい！ It's ${art} <b>${pic.name}</b>!（${sec}秒）`;
    sfx.fan(); sfx.clap(); starsAt(svg); addPoint(); nextTurn();
    later(()=>tts("It's " + art + " " + pic.name + "!"), 700);
    $("#after").style.display = "inline-flex"; $("#clock").style.display = "none";
    $("#againPic").onclick = ()=>dotGame(o); $("#toHome2").onclick = home;
  }
  function wrong(i){ sfx.ng(); const g = $(`#pts g[data-i="${i}"]`); g.classList.add("bad"); later(()=>g.classList.remove("bad"), 500); }
  svg.onpointerdown = e=>{
    if(ended) return; const p = toV(e), i = hit(p);
    if(i===k){ connect(); drag = !ended; }
    else if(k>0 && i===k-1){ drag = true; }        // 最後につないだ点から、指でなぞって次の点へ
    else if(i>=0 && i>k){ wrong(i); drag = false; }
    else drag = false;
    if(drag){ try{ svg.setPointerCapture(e.pointerId); }catch(_){} }
  };
  svg.onpointermove = e=>{
    if(!drag || ended || k===0) return; const p = toV(e), a = dots[k-1];
    rubber.setAttribute("x1",a.x); rubber.setAttribute("y1",a.y); rubber.setAttribute("x2",p.x); rubber.setAttribute("y2",p.y); rubber.setAttribute("visibility","visible");
    const i = hit(p); if(i===k){ connect(); }
  };
  svg.onpointerup = svg.onpointercancel = ()=>{ drag = false; rubber.setAttribute("visibility","hidden"); };
  info(); mark();
  startTimer(S.time, $("#tm"), ()=>{ if(!ended){ ended = true; result("時間です！", k, n, ()=>dotGame(o)); } });
}

    <div class="bar"><b>文字の見た目</b>${segHTML("font",[["手書き風","hand"],["活字（フォント）","print"]],S.font)}</div>
    <div class="bar"><b>声の速さ</b>${segHTML("rate",[["ゆっくり",0.6],["ふつう",0.8],["はやい",1]],S.rate)}<button class="hbtn" id="test">🔊 ためす</button></div>
    <p class="note">児童の名前は入力しません。得点は班の番号で表示します。</p>
    <h3>先生・ALTの声を録音する</h3>
    <p class="note">録音した文字は、機械の声の代わりに流れます（このタブレットの中だけに保存されます）。マイクの使用を「許可」してください。</p>
    <div class="vrow" id="vr"></div>
    <h3>かくれ文字さがしの写真</h3>
    <p class="note">写真を選んだあと、写真の中の文字の上をタップして、その文字を登録します。登録した丸をタップすると消せます。著作権・肖像権に気をつけて、校内や先生が撮った写真を使ってください。</p>
    <div class="bar"><label class="big blue" style="display:inline-flex;align-items:center">📷 写真を選ぶ<input type="file" accept="image/*" id="pf" hidden></label>
      ${segHTML("usePhoto",[["まちの絵を使う",false],["先生の写真を使う",true]],S.usePhoto)}<button class="hbtn" id="pdel">写真を消す</button></div>
    <div id="pe"></div>
  </div>`;
  document.body.appendChild(ov);
  const commit = ()=>{ save("abc-settings", S); renderScores(); };
  $$(".seg", ov).forEach(s=>s.onclick = e=>{ const b = e.target.closest("button"); if(!b) return; $$("button",s).forEach(x=>x.classList.remove("on")); b.classList.add("on");
    const n = s.dataset.name, v = b.dataset.v; S[n] = n==="kase"||n==="font" ? v : n==="usePhoto" ? v==="true" : Number(v);
    if(n==="teams" && SC.turn >= S.teams){ SC.turn = 0; save("abc-scores",SC); }
    commit(); });
  const lp = $("#lp", ov);
  const syncLetters = ()=>{ $$("button",lp).forEach(b=>b.classList.toggle("on", S.letters.includes(b.dataset.c))); };
  lp.onclick = e=>{ const b = e.target.closest("button"); if(!b) return; const c = b.dataset.c;
    S.letters = S.letters.includes(c) ? S.letters.replace(c,"") : UP.filter(x=>x===c || S.letters.includes(x)).join("");
    if(!S.letters) { S.letters = c; toast("1文字以上えらんでください"); }
    syncLetters(); commit(); };
  $$("[data-set]", ov).forEach(b=>b.onclick = ()=>{ S.letters = b.dataset.set; syncLetters(); commit(); });
  $("#reset", ov).onclick = ()=>{ if(confirm("班の得点を0にもどしますか？")){ SC = { pts:[0,0,0,0,0,0,0,0], solo:0, turn:0 }; save("abc-scores",SC); renderScores(); } };
  $("#test", ov).onclick = ()=>say("B");
  $("#close", ov).onclick = ()=>{ stopRec(); ov.remove(); home(); };
  // 録音
  let rec = null, recCh = null;
  function stopRec(){ if(rec && rec.state==="recording") rec.stop(); }
  function vrow(){
    $("#vr", ov).innerHTML = UP.map(c=>`<div><b class="ltr">${c}</b><button data-a="rec" data-c="${c}" class="${recCh===c?"rec":""}">${recCh===c?"■":"●"}</button><button data-a="play" data-c="${c}" ${VOICE[c]?"":"disabled"}>▶</button><button data-a="del" data-c="${c}" ${VOICE[c]?"":"disabled"}>×</button>${VOICE[c]?'<span class="has">✔</span>':""}</div>`).join("");
  }
  vrow();
  $("#vr", ov).onclick = async e=>{ const b = e.target.closest("button"); if(!b) return; const c = b.dataset.c, a = b.dataset.a;
    if(a==="play") return say(c);
    if(a==="del"){ if(!confirm(c+" の録音を消しますか？")) return; await kvDel("voice:"+c); if(VOICE[c]) URL.revokeObjectURL(VOICE[c]); delete VOICE[c]; return vrow(); }
    if(recCh===c){ stopRec(); return; }
    if(rec && rec.state==="recording") return toast("いまの録音を止めてから押してください");
    if(!navigator.mediaDevices || !window.MediaRecorder) return toast("この画面では録音が使えません");
    try{
      const st = await navigator.mediaDevices.getUserMedia({audio:true}); const chunks = [];
      rec = new MediaRecorder(st); recCh = c; vrow();
      rec.ondataavailable = ev=>chunks.push(ev.data);
      rec.onstop = async ()=>{ st.getTracks().forEach(t=>t.stop()); const blob = new Blob(chunks,{type:rec.mimeType||"audio/webm"}); await kvSet("voice:"+c, blob);
        if(VOICE[c]) URL.revokeObjectURL(VOICE[c]); VOICE[c] = URL.createObjectURL(blob); recCh = null; vrow(); toast(c+" を録音しました"); };
      rec.start(); setTimeout(()=>{ if(recCh===c) stopRec(); }, 3000);
    }catch(err){ recCh = null; vrow(); toast("マイクが使えませんでした（許可を確認してください）"); }
  };
  // 写真
  const pe = $("#pe", ov);
  const savePhoto = ()=> PHOTO ? kvSet("photo", { blob:PHOTO.blob, spots:PHOTO.spots }) : kvDel("photo");
  function photoEditor(){
    if(!PHOTO){ pe.innerHTML = `<p class="note">写真はまだありません。</p>`; return; }
    pe.innerHTML = `<p class="note">登録した文字：${PHOTO.spots.length}こ</p><div class="edit-photo" id="ep"><img src="${PHOTO.url}" alt="登録する写真">${PHOTO.spots.map((s,i)=>`<div class="dot" data-i="${i}" style="left:${s.x*100}%;top:${s.y*100}%;width:${s.r*200}%;aspect-ratio:1">${s.ch}</div>`).join("")}</div><div id="pick"></div>`;
    $("#ep", pe).onclick = e=>{
      const d = e.target.closest(".dot");
      if(d){ if(confirm("この丸を消しますか？")){ PHOTO.spots.splice(+d.dataset.i,1); savePhoto(); photoEditor(); } return; }
      const r = $("#ep", pe).getBoundingClientRect(); const x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
      $("#pick", pe).innerHTML = `<p class="msg">この場所の文字は？</p><div class="picker">${UP.concat(LO).map(c=>`<button data-c="${c}" class="ltr">${c}</button>`).join("")}</div><div class="bar" style="margin-top:8px"><b>丸の大きさ</b>${segHTML("sz",[["小",0.03],["中",0.05],["大",0.08]],0.05)}<button class="hbtn" id="pc">やめる</button></div>`;
      let sz = 0.05;
      $(".seg", $("#pick",pe)).onclick = ev=>{ const b = ev.target.closest("button"); if(!b) return; $$("button",b.parentNode).forEach(z=>z.classList.remove("on")); b.classList.add("on"); sz = +b.dataset.v; };
      $("#pc", pe).onclick = ()=>$("#pick", pe).innerHTML = "";
      $(".picker", $("#pick",pe)).onclick = ev=>{ const b = ev.target.closest("button"); if(!b) return; PHOTO.spots.push({ ch:b.dataset.c, x, y, r:sz }); savePhoto(); photoEditor(); };
      $("#pick", pe).scrollIntoView({behavior:"smooth", block:"nearest"});
    };
  }
  photoEditor();
  $("#pf", ov).onchange = async e=>{ const f = e.target.files[0]; if(!f) return; if(PHOTO) URL.revokeObjectURL(PHOTO.url);
    PHOTO = { blob:f, url:URL.createObjectURL(f), spots:[] }; await savePhoto(); S.usePhoto = true; commit();
    $$('[data-name="usePhoto"] button', ov).forEach(b=>b.classList.toggle("on", b.dataset.v==="true")); photoEditor(); };
  $("#pdel", ov).onclick = async ()=>{ if(!PHOTO || !confirm("写真と登録した文字を消しますか？")) return; URL.revokeObjectURL(PHOTO.url); PHOTO = null; await savePhoto(); S.usePhoto = false; commit(); photoEditor();
    $$('[data-name="usePhoto"] button', ov).forEach(b=>b.classList.toggle("on", b.dataset.v==="false")); };
}

/* ========== はじめ ========== */
$("#homeBtn").onclick = home;
renderScores(); home();
loadStored();
</script>
</body>
</html>
