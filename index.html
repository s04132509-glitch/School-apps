<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授業で使う学習アプリ</title>
<style>
:root{--bg:#fffaf0;--ink:#2b2b3a;--sub:#6b6b80;--line:#e6dfcf;--pri:#ff7a45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:clamp(22px,4vw,30px);margin:8px 0 4px}
p{color:var(--sub);margin:0 0 16px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
a.app{display:block;text-decoration:none;color:#fff;background:var(--pri);border-radius:20px;padding:20px;min-height:120px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
a.app b{display:block;font-size:24px;margin-bottom:6px}
a.app span{font-size:15px}
</style>
</head>
<body>
<main>
<h1>授業で使う学習アプリ</h1>
<p>タブレットや電子黒板のブラウザで開いて使います。児童の名前は入力しません。</p>
<div class="list">
  <a class="app" href="alphabet-games.html"><b>アルファベット・ゲームセンター</b><span>4年 外国語活動 Unit 6 Alphabet。カルタ・神経衰弱・かくれ文字さがし・なぞり・点つなぎ</span></a>
</div>
</main>
</body>
</html>
